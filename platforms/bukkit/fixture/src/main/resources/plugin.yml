name: proofstone-fixture
version: 0.1.0
main: io.github.h7kz.proofstone.fixture.FixturePlugin
# Folia refuses a plugin that does not declare it (docs/platforms/folia.md).
folia-supported: true
commands:
  fixture-reload:
    description: Reload hook named by the agent's reload endpoint (T-M2-03). Does nothing.
  fixture-log4j-error:
    description: Logs one ERROR with a stack trace straight through Log4j2, for the log capture test (T-M2-08).
  fixture-error:
    description: Logs one SEVERE record with a stack trace, for tests that provoke a server error (T-M2-08).
  fixture-getserver:
    description: Sends GetServer on the BungeeCord channel for the named player; the reply is logged (T-M7-12, topology P04).
