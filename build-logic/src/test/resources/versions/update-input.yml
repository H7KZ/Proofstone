# the version-watch workflow (card T-M3-01). Do not hand-edit pins once automation exists.
schema: 2

java-rules:            # first match wins; verify in T-M3-02
  - { range: "<=1.16.5",          image: java8 }
  - { range: "1.17.x",            image: java16 }
  - { range: ">=1.18 <1.20.5",    image: java17 }
  - { range: ">=1.20.5 <26",      image: java21 }
  - { range: ">=26",              image: java25 }

