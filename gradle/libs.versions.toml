# Single version catalog. Every dependency version lives here (AGENTS.md §3, ADR-0006).
# No ranges, no `+`, no `latest`, no SNAPSHOT.

[versions]
junit = "5.14.4"
testcontainers = "2.0.5"
jackson = "2.22.4"
assertj = "3.27.7"
archunit = "1.5.1"
mcprotocollib = "26.3-2"
shadow = "9.6.1"
# Bedrock driver (T-M9-05, ADR-0018 section 2). No release of CloudburstMC Protocol carries codec Bedrock_v2225 or exists at all
# (Maven Central and repo.opencollab.dev/maven-releases have no org.cloudburstmc.protocol, checked 2026-11-17), so these are exact
# timestamped snapshot builds, frozen like the Spigot API above. They live in the OpenCollab snapshots repository (settings.gradle.kts).
# The three Beta15 modules are one build; the netty and math modules are what that build's POM names, pinned to the builds the
# repository served on 2026-11-17 instead of the floating snapshot the POM says. drivers/bedrock checks every resolved jar's sha256.
cloudburst-protocol = "3.0.0.Beta15-20261116.161745-6"
cloudburst-netty = "1.1.0.CR4-20261103.123906-3"
cloudburst-math = "2.0-20220327.162752-1"
json-schema-validator = "1.5.9"
# Proofstone's own version, published to mavenLocal only (T-M6-04). Examples depend on it; nothing is published remotely.
proofstone = "0.1.0-local"
# Compile-only API of the example Paper plugin (T-M6-04). Build 244 is the paper@26.3 row of versions.yml. Stable release
# on repo.papermc.io, not a snapshot. Paper 26.3 classes are Java 25 bytecode.
paper = "26.3.build.244-stable"
# The Paper API's own types refer to Adventure (the version of the adventure-bom that paper-api 26.3 imports). Compile only.
adventure = "5.2.0"
# Guava as the paper-api 26.3 POM declares it. Compile only: Paper's own types refer to it. Not the test guava above.
paper-guava = "33.6.0-jre"
# Bukkit agent (T-M1-03). 1.8.8 is published only as a snapshot; this timestamped build is frozen and
# sha256 bc50bbc4d8226d75d0d75460828567b4580841d5987cae5c1d89b321f8ffc071 (spigot-api jar).
spigot = "1.8.8-R0.1-20160221.082514-43"
# Test only. The Spigot API's static registries need the Guava and commons-lang that Minecraft bundles; these
# are the versions the 1.8.8 POM declares.
guava = "17.0"
commons-lang = "2.6"
# Velocity agent (T-M7-05). Compile-only API of the pinned Velocity row (docs/platforms/velocity.md): 4.3.1, a stable release
# on repo.papermc.io; its jar is sha256 c0c662e9a563a4530894a81c7c2cf0b8f149d24ad6263725bb6c92c20d8e8dd3 and Java 25
# bytecode. The agent compiles against it with isTransitive = false, so the types its POM names are pinned one by one below
# at the versions that POM declares (velocity-brigadier is SNAPSHOT-only, so Mojang's brigadier stands in, compile and test only).
velocity-api = "4.3.1"
velocity-guice = "7.0.0"
velocity-slf4j = "2.0.20"
velocity-brigadier = "1.0.500"
# The proxy host image, build and jar checksum are in versions.yml `proxies` (schema 3, T-M7-08), not here.
# BungeeCord agent (T-M7-06). Compile-only API: 1.21-R0.4 is the newest release on Maven Central (the pinned row, build 2111,
# reports 26.1-R0.1-SNAPSHOT, which is not published as a release and cannot be pinned). Its POM names only Central artefacts.
bungee-api = "1.21-R0.4"
# BungeeCord's resolver classes are `provided` in the API POM, so they are absent from a plain classpath. PluginManager
# builds a LibraryLoader from them, and the unit tests construct a real PluginManager, so they are test-only dependencies
# at the versions that POM declares.
bungee-maven-resolver-provider = "3.9.6"
bungee-resolver = "1.9.18"
# Fabric agent (T-M8-05, ADR-0017 section 5). Compile only: the server provides all of it, nothing is shaded. Loom is not
# used (Loom 1.18+ needs Gradle on a JVM 25, ADR-0017 keeps Gradle on 21; Loom 1.17 adds project repositories, which
# settings refuse), so the agent compiles with javac against these jars, the fallback ADR-0017 section 5 allows.
# The loader and Fabric API are the fabric@26.3 row of versions.yml (FabricPinsTest checks they agree). Fabric API's sha256
# is the one maven.fabricmc.net publishes next to the jar.
fabric-loader = "0.20.1"
fabric-api = "0.166.2+26.3"
fabric-api-sha256 = "e8acacc7836f39237c83c2a664b039647ee36f93822797acc40cda44666002ea"
# The 26.3 vanilla server jar (Mojang's bundler: the game jar and its libraries inside), the same file the Fabric launcher
# fetches at a cell's cold start (ADR-0017 section 6). The "version" is its sha1, the content address in Mojang's 26.3
# manifest, so the URL names exactly one file; the build also checks the sha256 below before it unpacks it.
minecraft-server = "33680f5f2ac32864d6d7cf5e56a705fdb3e05f4c"
minecraft-server-sha256 = "d052f14d7a173734fba553711e5b570162e2f2a313267ee31a21b975a679be64"
# NeoForge agent (T-M8-06, ADR-0017 section 5). Compile only: the server provides all of it, nothing is shaded. Not
# ModDevGradle: its NeoForm pipeline fetches the game and its libraries at build time outside this catalog, each of which
# would need its own sha256 pin, so the agent compiles with javac against these jars, the fallback ADR-0017 section 5
# allows. Each jar is checked by the sha256 below before compiling (NeoForgePinsTest checks the version against the
# neoforge@26.3 row of versions.yml). The NeoForge sha256s are the ones maven.neoforged.net publishes; the two Maven
# Central ones were computed from the download (its .sha1 matched) and equal the jars the 26.3 installer puts in
# /data/libraries (T-M8-01 spike). The versions are the ones the NeoForge 26.3.0.103 POM declares.
neoforge = "26.3.0.103"
neoforge-sha256 = "a9c77eb071014c64fc028a40a41eec9657aae0526999c32363c7e13ed2a66dea"
neoforge-fml = "12.0.12"
neoforge-fml-sha256 = "24e64f915da20669431445ffab5f567552c3e01fd3c5c2cf000e5ceb75424a27"
neoforge-bus = "8.0.5"
neoforge-bus-sha256 = "705e24f37752809499a5cd0c7dd31eaabf3d933c5d3b2060168e94e9ef62593a"
neoforge-mergetool = "2.0.7"
neoforge-mergetool-sha256 = "e78f586e085206e3b5699bf0a8de3ee94c59dd34d8cd5b4033e8c58e5ac9c2ec"
neoforge-maven-artifact = "3.10.0"
neoforge-maven-artifact-sha256 = "5f97d58b507cd49887ce5f50e41832573ea204e9cf6705c9187a51b8ade9b543"
# Test only: the event bus needs it at run time (bus 8.0.5 POM, compile scope).
neoforge-typetools = "0.6.3"
neoforge-typetools-sha256 = "408300867804be05d1083cc0287dd3a21295a9e76090e288013ba5a4182dc96d"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
jackson-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "jackson" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind" }
jackson-dataformat-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "json-schema-validator" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
mcprotocollib-protocol = { module = "org.geysermc.mcprotocollib:protocol", version.ref = "mcprotocollib" }
cloudburst-bedrock-connection = { module = "org.cloudburstmc.protocol:bedrock-connection", version.ref = "cloudburst-protocol" }
cloudburst-bedrock-codec = { module = "org.cloudburstmc.protocol:bedrock-codec", version.ref = "cloudburst-protocol" }
cloudburst-protocol-common = { module = "org.cloudburstmc.protocol:common", version.ref = "cloudburst-protocol" }
cloudburst-netty-raknet = { module = "org.cloudburstmc.netty:netty-transport-raknet", version.ref = "cloudburst-netty" }
cloudburst-netty-common = { module = "org.cloudburstmc.netty:netty-transport-common", version.ref = "cloudburst-netty" }
cloudburst-math-immutable = { module = "org.cloudburstmc.math:immutable", version.ref = "cloudburst-math" }
spigot-api = { module = "org.spigotmc:spigot-api", version.ref = "spigot" }
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
adventure-api = { module = "net.kyori:adventure-api", version.ref = "adventure" }
paper-guava = { module = "com.google.guava:guava", version.ref = "paper-guava" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
commons-lang = { module = "commons-lang:commons-lang", version.ref = "commons-lang" }
velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocity-api" }
velocity-guice = { module = "com.google.inject:guice", version.ref = "velocity-guice" }
velocity-slf4j = { module = "org.slf4j:slf4j-api", version.ref = "velocity-slf4j" }
velocity-brigadier = { module = "com.mojang:brigadier", version.ref = "velocity-brigadier" }
bungee-api = { module = "net.md-5:bungeecord-api", version.ref = "bungee-api" }
bungee-maven-resolver-provider = { module = "org.apache.maven:maven-resolver-provider", version.ref = "bungee-maven-resolver-provider" }
bungee-resolver-connector-basic = { module = "org.apache.maven.resolver:maven-resolver-connector-basic", version.ref = "bungee-resolver" }
bungee-resolver-transport-http = { module = "org.apache.maven.resolver:maven-resolver-transport-http", version.ref = "bungee-resolver" }
adventure-text-minimessage = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure" }
adventure-text-serializer-plain = { module = "net.kyori:adventure-text-serializer-plain", version.ref = "adventure" }
minecraft-server = { module = "com.mojang.piston-data:server", version.ref = "minecraft-server" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api" }
neoforge = { module = "net.neoforged:neoforge", version.ref = "neoforge" }
neoforge-fml = { module = "net.neoforged.fancymodloader:loader", version.ref = "neoforge-fml" }
neoforge-bus = { module = "net.neoforged:bus", version.ref = "neoforge-bus" }
neoforge-mergetool = { module = "net.neoforged:mergetool", version.ref = "neoforge-mergetool" }
neoforge-maven-artifact = { module = "org.apache.maven:maven-artifact", version.ref = "neoforge-maven-artifact" }
neoforge-typetools = { module = "net.jodah:typetools", version.ref = "neoforge-typetools" }

# Build-logic only. Not on any runtime classpath.
shadow-gradle-plugin = { module = "com.gradleup.shadow:shadow-gradle-plugin", version.ref = "shadow" }
