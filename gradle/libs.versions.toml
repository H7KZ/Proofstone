# Single version catalog. Every dependency version lives here (AGENTS.md §3, ADR-0006).
# No ranges, no `+`, no `latest`, no SNAPSHOT.

[versions]
junit = "5.14.4"
testcontainers = "2.0.5"
jackson = "2.22.4"
assertj = "3.27.7"
archunit = "1.5.1"
mcprotocollib = "26.3-2"
shadow = "9.6.1"
json-schema-validator = "1.5.9"
# Proofstone's own version, published to mavenLocal only (T-M6-04). Examples depend on it; nothing is published remotely.
proofstone = "0.1.0-local"
# Compile-only API of the example Paper plugin (T-M6-04). Build 244 is the paper@26.3 row of versions.yml. Stable release
# on repo.papermc.io, not a snapshot. Paper 26.3 classes are Java 25 bytecode.
paper = "26.3.build.244-stable"
# The Paper API's own types refer to Adventure (the version of the adventure-bom that paper-api 26.3 imports). Compile only.
adventure = "5.2.0"
# Guava as the paper-api 26.3 POM declares it. Compile only: Paper's own types refer to it. Not the test guava above.
paper-guava = "33.6.0-jre"
# Bukkit agent (T-M1-03). 1.8.8 is published only as a snapshot; this timestamped build is frozen and
# sha256 bc50bbc4d8226d75d0d75460828567b4580841d5987cae5c1d89b321f8ffc071 (spigot-api jar).
spigot = "1.8.8-R0.1-20160221.082514-43"
# Test only. The Spigot API's static registries need the Guava and commons-lang that Minecraft bundles; these
# are the versions the 1.8.8 POM declares.
guava = "17.0"
commons-lang = "2.6"
# Velocity agent (T-M7-05). Compile-only API of the pinned Velocity row (docs/platforms/velocity.md): 4.3.1, a stable release
# on repo.papermc.io; its jar is sha256 c0c662e9a563a4530894a81c7c2cf0b8f149d24ad6263725bb6c92c20d8e8dd3 and Java 25
# bytecode. The agent compiles against it with isTransitive = false, so the types its POM names are pinned one by one below
# at the versions that POM declares (velocity-brigadier is SNAPSHOT-only, so Mojang's brigadier stands in, compile and test only).
velocity-api = "4.3.1"
velocity-guice = "7.0.0"
velocity-slf4j = "2.0.20"
velocity-brigadier = "1.0.500"
# The pins the Velocity real-server test boots (ADR-0016 section 2). They live here, not in versions.yml, until the schema 3
# `proxies` key exists (T-M7-08), which then takes them over. Image: itzg/mc-proxy release 2026.11.1, java25 tag, index digest.
# Jar: Velocity 4.3.1 build 45 from the Paper fill API (sha256 below, checked in the container before the test runs).
velocity-host-image = "itzg/mc-proxy"
velocity-host-digest = "sha256:8efdaa9d990f4c509f21b7ced003dd959060777784422fd72fdd537d613c1813"
velocity-build = "45"
velocity-jar-sha256 = "0844bcabdcdb4f5b875906fd4c3365bc1bb76918e42bc595ed88ad195258dd75"
# BungeeCord agent (T-M7-06). Compile-only API: 1.21-R0.4 is the newest release on Maven Central (the pinned row, build 2111,
# reports 26.1-R0.1-SNAPSHOT, which is not published as a release and cannot be pinned). Its POM names only Central artefacts.
bungee-api = "1.21-R0.4"
# BungeeCord's resolver classes are `provided` in the API POM, so they are absent from a plain classpath. PluginManager
# builds a LibraryLoader from them, and the unit tests construct a real PluginManager, so they are test-only dependencies
# at the versions that POM declares.
bungee-maven-resolver-provider = "3.9.6"
bungee-resolver = "1.9.18"
# The pins the BungeeCord real-server test boots (ADR-0016 section 2), here until the schema 3 `proxies` key exists (T-M7-08).
# Image: itzg/mc-proxy release 2026.11.1, java21 tag, index digest. Jar: build 2111 from Jenkins (job BungeeCord, which
# publishes md5 only), so the sha256 is computed from the download and checked in the container before the test runs.
bungee-host-image = "itzg/mc-proxy"
bungee-host-digest = "sha256:4e6901b4640a913ef6d8470de887b89ff6d19702e410edfbccdbdbce4b54159f"
bungee-build = "2111"
bungee-jar-sha256 = "1d9dbc31b57b22a37553f160ac1b61762717e9e4a6a1341f3dd27a1f6f2671fd"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
jackson-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "jackson" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind" }
jackson-dataformat-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "json-schema-validator" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
mcprotocollib-protocol = { module = "org.geysermc.mcprotocollib:protocol", version.ref = "mcprotocollib" }
spigot-api = { module = "org.spigotmc:spigot-api", version.ref = "spigot" }
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
adventure-api = { module = "net.kyori:adventure-api", version.ref = "adventure" }
paper-guava = { module = "com.google.guava:guava", version.ref = "paper-guava" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
commons-lang = { module = "commons-lang:commons-lang", version.ref = "commons-lang" }
velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocity-api" }
velocity-guice = { module = "com.google.inject:guice", version.ref = "velocity-guice" }
velocity-slf4j = { module = "org.slf4j:slf4j-api", version.ref = "velocity-slf4j" }
velocity-brigadier = { module = "com.mojang:brigadier", version.ref = "velocity-brigadier" }
bungee-api = { module = "net.md-5:bungeecord-api", version.ref = "bungee-api" }
bungee-maven-resolver-provider = { module = "org.apache.maven:maven-resolver-provider", version.ref = "bungee-maven-resolver-provider" }
bungee-resolver-connector-basic = { module = "org.apache.maven.resolver:maven-resolver-connector-basic", version.ref = "bungee-resolver" }
bungee-resolver-transport-http = { module = "org.apache.maven.resolver:maven-resolver-transport-http", version.ref = "bungee-resolver" }
adventure-text-minimessage = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure" }
adventure-text-serializer-plain = { module = "net.kyori:adventure-text-serializer-plain", version.ref = "adventure" }

# Build-logic only. Not on any runtime classpath.
shadow-gradle-plugin = { module = "com.gradleup.shadow:shadow-gradle-plugin", version.ref = "shadow" }
