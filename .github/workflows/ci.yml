# Gate workflow: AGENTS.md §4. `gates` and `renovate-validate` need no Docker. `smoke` runs `:conformance:run`
# (C01 to C08 on the newest Paper row, T-M1-11, T-M2-09, T-M3-05) on a Docker runner. Without the Minecraft EULA it fails, never skips.
# The repo owner accepts the Minecraft EULA (https://aka.ms/MinecraftEULA) for the `smoke` job below, and said so in chat on 2026-11-03.
name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR cancels the older run: Actions minutes are billed to the maintainer.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: check and docsCheck
        run: ./gradlew check docsCheck

  # Manual only: Actions minutes are billed to the maintainer. Run `./gradlew :conformance:run` locally instead.
  smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: conformance (C01 to C08)
        env:
          PROOFSTONE_ACCEPT_EULA: "true"
        run: ./gradlew :conformance:run

  renovate-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The check stays required, so the job always runs, but the slow part (Node + Renovate download) runs only
      # when renovate.json changed. A skipped step reports success, not a hidden pass: the log says why.
      - name: Did renovate.json change?
        id: changed
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] || ! git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- renovate.json; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "renovate.json unchanged against ${{ github.base_ref }}: validation skipped (it ran on the commit that last changed it)."
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changed.outputs.run == 'true'
        with:
          node-version: "26.3.0"
      - name: Validate renovate.json (pinned Renovate)
        if: steps.changed.outputs.run == 'true'
        run: npx --yes --package renovate@44.171.1 -- renovate-config-validator --strict renovate.json
