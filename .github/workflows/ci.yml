# Gate workflow: AGENTS.md §4. `gates` and `renovate-validate` need no Docker. `smoke` runs `:conformance:smoke`
# (C01, C02 on the newest Paper row, T-M1-11) on a Docker runner. Without the Minecraft EULA it fails, never skips.
# The repo owner decides whether EULA acceptance is set for CI; this workflow does not set it.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: check and docsCheck
        run: ./gradlew check docsCheck

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: conformance smoke (C01, C02)
        run: ./gradlew :conformance:smoke

  renovate-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.3.0"
      - name: Validate renovate.json (pinned Renovate)
        run: npx --yes --package renovate@44.171.1 -- renovate-config-validator --strict renovate.json
