# Nightly self-test set (T-M4-99, docs/specs/self-tests.md §2 to §4, docs/robustness.md §4). Manual only
# (workflow_dispatch): there is deliberately NO `schedule:` trigger. Scheduled Actions minutes were cancelled at PR #40
# (billed to the maintainer). Turning on a schedule is a maintainer decision, recorded in the M4 review (ROADMAP).
# The job runs `:examples:bad-tests:metaTest`, which runs the control run (VacuousE2E, VACUOUS), the repeat run
# (FlakyE2E, FLAKY, repeat=5), the differential run (DriverFaultDisagreeE2E, DISAGREE) and the INVALID and LEAK bad tests.
# It asserts each expected verdict, so a green job means every safety net still catches what it claims to catch.
# The cells are the ones the bad tests pin: paper@26.3 (native) and paper@26.1.2 (bridged, and the reference
# driver's row). No Paper row is added, so the job stays small (ROADMAP M4 review).
# The EULA is accepted by the repository variable PROOFSTONE_ACCEPT_EULA, the same mechanism as the matrix job
# (AGENTS.md section 4). It is never written to a file. Unset, the tests skip with a reason and metaTest fails.
name: nightly

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Java 21: the mcpl driver (ADR-0004) and the bad tests need a Java 21 toolchain.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: metaTest (control, repeat, differential, invalid, leak)
        env:
          PROOFSTONE_ACCEPT_EULA: ${{ vars.PROOFSTONE_ACCEPT_EULA }}
        run: ./gradlew :examples:bad-tests:metaTest --no-parallel
      - name: upload repro bundles and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-self-tests
          path: |
            **/build/proofstone/**
            examples/bad-tests/build/test-results/
          if-no-files-found: warn
