# ADR-0019. The no-Docker gates on every PR: bash scripts/gates.sh. Real-server suites stay local (AGENTS.md section 4).
name: gates
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
permissions:
  contents: read
concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scripts/gates.sh diffs renovate.json against origin/main
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: |
            26
            17
            21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # The default writes the Gradle cache only on the default branch (main), which only releases touch, so every run was cold
          # (T-M6-113). Pushes to develop write it; pull requests only read it (a PR never writes a cache others restore).
          cache-read-only: ${{ github.event_name != 'push' }}
      # Downloads dependencies only, retried only on a dependency download error (T-M6-113). The gates below are never retried.
      - run: bash scripts/ci-prefetch-deps.sh --max-workers=2
      - run: bash scripts/gates.sh --max-workers=2
