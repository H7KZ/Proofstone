# Manual only (workflow_dispatch): Actions minutes are billed to the maintainer. Run the cells locally instead.
# CI matrix (T-M3-07, docs/versioning.md §4, ADR-0008). The cells come from versions.yml through
# `./gradlew printMatrix --scope=pr|nightly`, so adding a row adds a job with no edit here. One job per cell runs
# `:conformance:run` on that cell and uploads its repro bundle. PR runs only the required rows; nightly runs every
# non-retired row. None of these jobs is a required check (set in branch protection, not here).
# A cell job skips only when the plan has no cell, and the plan job says why on its log.
name: matrix

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Matrix scope"
        type: choice
        options: [pr, nightly]
        default: pr

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_cells: ${{ steps.plan.outputs.has_cells }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: printMatrix
        id: plan
        env:
          SCOPE: ${{ github.event_name == 'schedule' && 'nightly' || github.event.inputs.scope || 'pr' }}
        run: |
          ./gradlew printMatrix --scope="$SCOPE" 2> >(tee build-matrix.err >&2)
          # Make skipped platforms (TODO pins, no required row) visible on the run page, not only in the log.
          {
            echo "### matrix plan ($SCOPE): $(jq '.include | length' "build/ci/matrix-$SCOPE.json") cell(s)"
            grep '^printMatrix: skipped' build-matrix.err || echo "no platform skipped"
          } >> "$GITHUB_STEP_SUMMARY"
          grep '^printMatrix: skipped' build-matrix.err | sed 's/^/::warning::/' || true
          echo "matrix=$(jq -c . "build/ci/matrix-$SCOPE.json")" >> "$GITHUB_OUTPUT"
          echo "has_cells=$(jq -r '.include | length > 0' "build/ci/matrix-$SCOPE.json")" >> "$GITHUB_OUTPUT"

  cell:
    needs: plan
    if: needs.plan.outputs.has_cells == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: cell ${{ matrix.cell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: conformance on ${{ matrix.cell }}
        env:
          # The EULA acceptance is a repository variable, never written into a file (AGENTS.md section 4).
          PROOFSTONE_ACCEPT_EULA: ${{ vars.PROOFSTONE_ACCEPT_EULA }}
          CELL: ${{ matrix.cell }}
        run: ./gradlew :conformance:run -Dproofstone.cells="$CELL"
      - name: upload repro bundle
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repro-${{ matrix.slug }}
          path: |
            **/build/proofstone/**
            conformance/build/test-results/
          if-no-files-found: warn
