    host:
      image: "itzg/minecraft-server"
      # Same image and per-tag digests as paper, folia and purpur (ADR-0013). The jar is not downloaded: itzg runs the
      # BuildTools output as TYPE=CUSTOM (SpigotServerJar, T-M5-05).
      digests:
        java8:  "sha256:1bf0a9afde1fc4a0ffb54075339ec9d28dc6c9cb382e27bba72ebaaa764a7db0"
