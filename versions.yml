        java25: "sha256:e2fabc536673f8c6b343055c93f7a73e10caa79cd3368f645987593c65adf1e0"
    builder:
      # images/spigot-buildtools runs BuildTools for each row's rev (the Minecraft version). The jar is built locally,
      # cached by its digest, and never redistributed. A row's sha256 is the jar's content digest (JarDigest): SHA-256 over
      # every entry name and content, minus Maven's build-time comment in pom.properties; a rebuild must match it.
