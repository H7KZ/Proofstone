# Source of truth for the Proofstone version matrix. Spec: docs/specs/versions-yml.md
# SEED DATA: rows below are the cells exercised by the 2026-11-03 prototype. Pins marked "TODO" are filled by
# the version-watch workflow (card T-M3-01). Do not hand-edit pins once automation exists.
schema: 1

java-rules:            # first match wins; verify in T-M3-02
  - { range: "<=1.16.5",          image: java8 }
  - { range: "1.17.x",            image: java16 }
  - { range: ">=1.18 <1.20.5",    image: java17 }
  - { range: ">=1.20.5 <26",      image: java21 }
  - { range: ">=26",              image: java25 }

drivers:
  mcpl:            { library: "org.geysermc.mcprotocollib:protocol", version: "26.3-2", protocol: "26.3" }
  mineflayer-ref:  { library: "mineflayer", version: "4.39.0", max-native: "26.1" }
  viaproxy:        { image: "ghcr.io/viaversion/viaproxy", digest: TODO }

platforms:
